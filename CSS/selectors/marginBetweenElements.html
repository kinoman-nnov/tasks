<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      font: 14px/1.5 serif;
    }

    ul {
      margin: 0;
    }

    /* Вертикальный отступ между элементами  */
    li:not(:last-child) {
      margin-bottom: 1.5em;
    }

    /* вариант learnJs */
    /* li:nth-child(n+2) {
        margin-top: 1.5em;
      } */
    /* li + li {
        margin-top: 1.5em;
      } */

    /* Вертикальный отступ между каждой парой элементов */
    /* li:nth-child(2n+3){
      margin-top: 1.5em;
    } */
  </style>
</head>

<body>

  Текст вверху без отступа от списка.
  <ul>
    <li>Маша</li>
    <li>Паша</li>
    <li>Даша</li>
    <li>Женя</li>
    <li>Саша</li>
    <li>Гоша</li>
  </ul>
  Текст внизу без отступа от списка.

</body>

</html>
